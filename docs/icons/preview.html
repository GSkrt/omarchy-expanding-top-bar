<!doctype html>
<meta charset="utf-8">
<title>Group icon proposal</title>
<style>
  body { background:#1b2420; color:#d8dee9; font:14px system-ui,sans-serif; margin:32px }
  h1 { font-size:18px }
  p { color:#98a3a0; max-width:60ch }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px; margin:24px 0 }
  figure { margin:0; padding:16px 8px; border:1px solid #ffffff22; border-radius:10px; text-align:center }
  figure img { width:48px; height:48px }
  figcaption { margin-top:8px } small { display:block; color:#98a3a0; font-size:11px }
  .bar { display:inline-flex; gap:14px; align-items:center; padding:6px 14px; background:#0f1613; border-radius:6px }
  .bar img { width:18px; height:18px }
</style>
<h1>Group icon proposal</h1>
<p>First draft for the UI contributor. 24&times;24, 1.75 stroke, round caps, no fills. Improve, replace or add to them.</p>
<div class="grid">
    <figure><img src="connectivity.svg" alt="connectivity"><figcaption>connectivity<small>Wi-Fi arcs</small></figcaption></figure>
    <figure><img src="audio.svg" alt="audio"><figcaption>audio<small>Speaker with waves</small></figcaption></figure>
    <figure><img src="system.svg" alt="system"><figcaption>system<small>Chip</small></figcaption></figure>
    <figure><img src="power.svg" alt="power"><figcaption>power<small>Battery with bolt</small></figcaption></figure>
    <figure><img src="display.svg" alt="display"><figcaption>display<small>Monitor</small></figcaption></figure>
    <figure><img src="notifications.svg" alt="notifications"><figcaption>notifications<small>Bell</small></figcaption></figure>
    <figure><img src="tools.svg" alt="tools"><figcaption>tools<small>Sliders</small></figcaption></figure>
    <figure><img src="cloud.svg" alt="cloud"><figcaption>cloud<small>Cloud</small></figcaption></figure>
    <figure><img src="monitoring.svg" alt="monitoring"><figcaption>monitoring<small>Activity pulse</small></figcaption></figure>
    <figure><img src="devices.svg" alt="devices"><figcaption>devices<small>Bluetooth rune</small></figcaption></figure>
    <figure><img src="security.svg" alt="security"><figcaption>security<small>Shield</small></figcaption></figure>
    <figure><img src="fitness.svg" alt="fitness"><figcaption>fitness<small>Dumbbell</small></figcaption></figure>
</div>
